[pytest]
asyncio_mode = auto
testpaths = tests/e2e
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers
markers =
    asyncio: marks tests as async
    slow: marks tests as slow
    integration: marks tests as integration tests
    screenshot: marks tests that capture screenshots
    accessibility: marks accessibility tests
    responsive: marks responsive design tests
    theme: marks theme switching tests
    auth: marks authentication tests
    brand: marks brand management tests
    qr: marks QR generation tests

# Console output
console_output_style = progress

# Test discovery
norecursedirs = .git .tox dist build *.egg venv

# Coverage options (if using pytest-cov)
[coverage:run]
source = .
omit =
    */tests/*
    */venv/*
    */migrations/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
